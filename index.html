<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>알고리즘 카드 스튜디오</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <section id="home-page" class="page">
      <div class="hero-copy">
        <span class="eyebrow">MACHINE LEARNING LAB</span>
        <h1>알고리즘 카드 스튜디오</h1>
        <p>카드뉴스로 개념을 읽고, 바로 옆 실험실에서 알고리즘의 변화를 직접 조작해보세요.</p>
      </div>
      <div id="algorithm-cards"></div>
    </section>

    <section id="concept-page" class="page hidden">
      <button class="text-button" onclick="goHome()">← 전체 카드</button>
      <div class="concept-layout">
        <div class="concept-intro">
          <span id="concept-kicker" class="eyebrow"></span>
          <h2 id="concept-title"></h2>
          <p id="concept-summary"></p>
          <button class="primary-button" onclick="openCurrentSimulator()">시뮬레이터로 이동 →</button>
        </div>
        <div class="concept-sections">
          <article><span>01</span><h3>핵심 개념</h3><p id="concept-core"></p></article>
          <article><span>02</span><h3>무엇을 조작하나요?</h3><p id="concept-controls"></p></article>
          <article><span>03</span><h3>관찰 포인트</h3><p id="concept-observe"></p></article>
          <article><span>04</span><h3>수식과 활용</h3><p id="concept-formula"></p></article>
        </div>
      </div>
    </section>

    <section id="simulator-page" class="page hidden">
      <div class="sim-header">
        <div><button class="text-button" onclick="showConcept(currentAlgorithm)">← 개념으로 돌아가기</button><span id="sim-kicker" class="eyebrow"></span><h2 id="sim-title"></h2></div>
        <button class="secondary-button" onclick="goHome()">전체 카드</button>
      </div>
      <div id="simulator-content"></div>
    </section>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script src="script.js"></script>
</body>
</html>
